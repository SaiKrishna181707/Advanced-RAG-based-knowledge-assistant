# Render Blueprint for the RAG backend
services:
  - type: web
    name: rag-assistant-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/src/backend/data
      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/backend/data/uploads
      - key: MAX_FILE_SIZE_MB
        value: 50
    disk:
      name: rag-storage
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
