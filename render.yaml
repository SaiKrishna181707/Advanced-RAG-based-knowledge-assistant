# render.yaml  —  Tells Render how to deploy the backend
# Commit this file to GitHub. Render reads it automatically.

services:
  - type: web
    name: rag-assistant-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false          # You'll paste this in Render dashboard (never in code)
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
    disk:
      name: rag-storage
      mountPath: /opt/render/project/src/backend
      sizeGB: 1              # Stores FAISS index + SQLite + uploads
